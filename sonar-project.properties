# SonarQube / SonarCloud configuration. Set sonar.host.url, sonar.token (and sonar.organization
# for SonarCloud) in the CI environment, never in this file.
sonar.projectKey=healthcare-app
sonar.projectName=[APP_NAME] Healthcare Platform
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=server/src,server/prisma/seed.ts,server/scripts,client/src
# Add server/test here once the vitest suite (server/test/unit/**) exists — Sonar fails on missing paths.
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,tests/**/*.ts

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  server/src/generated/**,\
  server/prisma/migrations/**,\
  playwright-report/**,\
  test-results/**,\
  blob-report/**,\
  coverage/**,\
  demo/**,\
  var/**

# Seed data and CLI scripts are not production paths.
sonar.coverage.exclusions=\
  server/prisma/**,\
  server/scripts/**,\
  **/*.config.ts,\
  **/*.config.js

sonar.cpd.exclusions=server/prisma/seed.ts

# Coverage report (produce with `vitest run --coverage` once @vitest/coverage-v8 is added).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,server/coverage/lcov.info
